# Render.com blueprint: New > Blueprint, point it at the repo that contains this folder.
services:
  - type: web
    name: oracle-health-mock-ehr
    runtime: node
    plan: free
    buildCommand: echo "no build step"
    startCommand: node server.js
    healthCheckPath: /api/health
    envVars:
      - key: DEMO_TZ
        value: America/Chicago
      - key: API_KEY
        generateValue: true
      # Who may iframe the app. "*" works with every Genesys Cloud region; tighten later if needed.
      - key: FRAME_ANCESTORS
        value: "*"
